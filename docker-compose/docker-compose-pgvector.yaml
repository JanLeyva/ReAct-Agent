name: pgvector

services:
  timescaledb:
    image: ankane/pgvector
    container_name: pgvector
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - pgvector:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  timescaledb_data: